# Runs the checks for the static cohort replace work (PostHog/posthog#121486) on free GitHub-hosted runners, against
# any ref of jadibdev/posthog. It replaces the codespace for heavy validation: each run starts fresh, so it installs
# from the ref's own lockfile and migrates from scratch.
#
# The environment follows PostHog's own backend CI (.depot/workflows/ci-backend.yml): the same service containers
# through bin/ci-wait-for-docker, Python 3.14.7 with `uv sync --frozen --dev`, the service hostnames in /etc/hosts,
# sqlx-cli for the persons database, and an out-of-process migrate before `pytest --reuse-db`.
#
# The node job follows PostHog's check-openapi-types job (.depot/workflows/ci-backend.yml) and the build and unit-tests
# jobs of .github/workflows/ci-mcp.yml. The benchmark job follows the release build in .github/workflows/ci-rust.yml
# and the benchmark branch's own README.
#
# Trigger: Actions tab, "Cohort replace checks", Run workflow. Or:
#   gh workflow run cohort-replace-checks.yml -R <repo holding this file> -f ref=<branch or sha> -f commits=10
#   ... -f tests=false -f node=false -f benchmark=true   # the benchmark alone
name: Cohort replace checks

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or full commit SHA of jadibdev/posthog to check
                required: true
            commits:
                description: How many commits at the tip of the ref to lint one by one (the branch's own commits)
                required: true
                default: '10'
            tests:
                description: Run the test suites (false runs only the lint job)
                type: boolean
                default: true
            broad:
                description: With tests, run the broad backend suites (API, tasks, models, cohorts, feature flags) in parallel jobs instead of the targeted ones
                type: boolean
                default: false
            rust:
                description: Run the personhog-replica and personhog-router Rust tests against a migrated persons database
                type: boolean
                default: false
            node:
                description: Regenerate the OpenAPI and MCP outputs, fail on drift, and run the MCP tests
                type: boolean
                default: true
            proto:
                description: Lint the protos, check them for breaking changes against the merge base with PostHog's master, regenerate the Python and Node personhog stubs and fail on drift, and run the personhog Node tests
                type: boolean
                default: false
            preflight:
                description: Migrate the dev stack and run hogli ci:preflight --strict against PostHog's master, as the pre-push hook does
                type: boolean
                default: false
            benchmark:
                description: Build personhog in release mode and run the replace benchmark (about 1.5 hours)
                type: boolean
                default: false
            benchmark_ref:
                description: Branch or SHA of jadibdev/posthog that holds the benchmark harness
                required: false
                default: jadibdev/cohorts/static-cohort-replace-benchmark
            bench_cells:
                description: Optional single benchmark cell to run instead of memory and the 1M pair (e.g. replace:10000000:0.0)
                required: false
                default: ''

permissions:
    contents: read

concurrency:
    group: cohort-replace-checks-${{ inputs.ref }}
    cancel-in-progress: false

env:
    SOURCE_REPO: jadibdev/posthog
    PYTHON_VERSION: 3.14.7
    PY_DEPS_SYNC_TIMEOUT: 600s
    # Test-only values, the same as PostHog's backend CI.
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da' # unsafe - for testing only
    DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
    REDIS_URL: 'redis://localhost'
    CLICKHOUSE_HOST: 'localhost'
    CLICKHOUSE_SECURE: 'False'
    CLICKHOUSE_VERIFY: 'False'
    TEST: 1
    OBJECT_STORAGE_ENABLED: 'True'
    OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'

jobs:
    lint:
        name: Lint each commit, ruff and mypy
        runs-on: ubuntu-24.04
        timeout-minutes: 40
        steps:
            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}
                  # Enough history to lint the branch's commits one by one.
                  fetch-depth: 60

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              # PostHog's CI retries this step (Depot's retry:); GitHub Actions has no step retry, so loop.
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            - name: Each commit imports cleanly (no undefined, unused or redefined names)
              env:
                  COMMITS: ${{ inputs.commits }}
              run: |
                  set -uo pipefail
                  base=$(git rev-parse "HEAD~${COMMITS}")
                  echo "Checking $(git rev-list --count "$base..HEAD") commits after $(git log -1 --format='%h %s' "$base")"
                  findings=0
                  for c in $(git rev-list --reverse "$base..HEAD"); do
                      echo "::group::$(git log -1 --format='%h %s' "$c")"
                      for f in $(git diff-tree --no-commit-id --name-only --diff-filter=d -r "$c" -- '*.py'); do
                          out=$(git show "$c:$f" | ruff check --select F821,F401,F811,F841 --stdin-filename "$f" --output-format concise -q - || true)
                          if [ -n "$out" ]; then echo "$out"; findings=$((findings + 1)); fi
                      done
                      echo "::endgroup::"
                  done
                  echo "Files with findings: $findings"
                  [ "$findings" -eq 0 ]

            - name: ruff on the files the branch changes
              if: ${{ !cancelled() }}
              env:
                  COMMITS: ${{ inputs.commits }}
              run: |
                  files=$(git diff --name-only --diff-filter=d "HEAD~${COMMITS}" HEAD -- '*.py')
                  echo "$files"
                  ruff check $files
                  ruff format --check $files

            - name: mypy on the cohort replace files
              if: ${{ !cancelled() }}
              run: |
                  mypy posthog/tasks/calculate_cohort.py products/cohorts/backend/models/util.py \
                      products/cohorts/backend/models/cohort.py posthog/api/cohort.py \
                      posthog/tasks/test/test_calculate_cohort.py posthog/api/test/test_cohort.py

    tests:
        name: Migrations and test suites (${{ matrix.group }})
        if: ${{ inputs.tests }}
        runs-on: ubuntu-24.04
        timeout-minutes: ${{ matrix.group == 'targeted' && 150 || 350 }}
        strategy:
            fail-fast: false
            # Targeted: the cohort replace suites only. Broad: the directories the change can reach, run serially in each
            # job (-n 4 ran out of memory in a 16 GB codespace), split by test count with the ref's pytest-split.
            # The broad groups are a superset of the targeted suites.
            matrix:
                include: >-
                    ${{ fromJSON(inputs.broad && '[
                    {"group":"api-1","split":"--splits 4 --group 1","paths":"posthog/api/test"},
                    {"group":"api-2","split":"--splits 4 --group 2","paths":"posthog/api/test"},
                    {"group":"api-3","split":"--splits 4 --group 3","paths":"posthog/api/test"},
                    {"group":"api-4","split":"--splits 4 --group 4","paths":"posthog/api/test"},
                    {"group":"tasks","split":"","paths":"posthog/tasks/test posthog/test/test_cohort_model.py posthog/personhog_client/test_fake_client.py"},
                    {"group":"models-1","split":"--splits 2 --group 1","paths":"posthog/models"},
                    {"group":"models-2","split":"--splits 2 --group 2","paths":"posthog/models"},
                    {"group":"products-1","split":"--splits 2 --group 1","paths":"products/cohorts products/feature_flags"},
                    {"group":"products-2","split":"--splits 2 --group 2","paths":"products/cohorts products/feature_flags"}
                    ]' || '[{"group":"targeted"}]') }}
        steps:
            - name: Free disk space for the service images
              # A hosted runner starts with about 14 GB free; the service images and the Python environment need more.
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            - name: Start services
              # The same services and profiles as PostHog's backend CI: the broad suites need Temporal, among others.
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  nohup bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage \
                    temporal elasticsearch objectstorage-azure </dev/null >"$RUNNER_TEMP/compose-launch.log" 2>&1

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              # PostHog's CI retries this step (Depot's retry:); GitHub Actions has no step retry, so loop.
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb

            - name: Wait for services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
              run: |
                  bin/ci-wait-for-docker wait objectstorage \
                    || { echo "::group::compose launch log"; cat "$RUNNER_TEMP/compose-launch.log" || true; echo "::endgroup::"; exit 1; }

            - name: Migrate test_posthog from scratch
              # As PostHog's CI does: the full migration chain runs in its own process, then pytest adopts the database.
              env:
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
              run: |
                  docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres \
                    -c "DROP DATABASE IF EXISTS test_posthog;" -c "CREATE DATABASE test_posthog;"
                  python manage.py migrate

            - name: No missing or conflicting migrations
              env:
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
              run: python manage.py makemigrations --check --dry-run

            - name: Cohort, task and personhog fake-client suites
              if: ${{ !cancelled() && matrix.group == 'targeted' }}
              run: >-
                  pytest -p no:cacheprovider --reuse-db -q --junitxml=junit-cohort-suites.xml
                  products/cohorts/backend/ posthog/test/test_cohort_model.py
                  posthog/tasks/test/test_calculate_cohort.py posthog/personhog_client/test_fake_client.py

            - name: Cohort API suite
              if: ${{ !cancelled() && matrix.group == 'targeted' }}
              run: pytest -p no:cacheprovider --reuse-db -q --junitxml=junit-api-cohort.xml posthog/api/test/test_cohort.py

            - name: Suites for files upstream also changed (resource-transfer snapshot, flags cache)
              if: ${{ !cancelled() && matrix.group == 'targeted' }}
              run: >-
                  pytest -p no:cacheprovider --reuse-db -q --junitxml=junit-overlap.xml
                  posthog/models/resource_transfer/test/test_visitor_field_snapshots.py
                  products/feature_flags/backend/test/test_flags_cache.py

            - name: Broad suite ${{ matrix.group }}
              if: ${{ !cancelled() && matrix.group != 'targeted' }}
              run: >-
                  pytest -p no:cacheprovider --reuse-db -q --junitxml=junit-${{ matrix.group }}.xml
                  ${{ matrix.split }} ${{ matrix.paths }}

            - name: Upload test reports
              if: ${{ always() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: test-reports-${{ github.run_id }}-${{ matrix.group }}
                  path: junit-*.xml
                  if-no-files-found: ignore

    rust:
        name: personhog Rust tests
        if: ${{ inputs.rust }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        defaults:
            run:
                working-directory: rust
        env:
            # The query macros check against the committed .sqlx data, as a fresh checkout has no schema at build time.
            SQLX_OFFLINE: 'true'
            DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog_persons
        steps:
            - name: Free disk space for the Rust build
              working-directory: .
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            # As ci-rust's personhog job: Postgres, and etcd for the router's stash integration tests. Then the
            # persons database, created and migrated with sqlx.
            - name: Start Postgres and etcd
              env:
                  COMPOSE_FILE: ../docker-compose.dev.yml:../docker-compose.profiles.yml
                  COMPOSE_PROFILES: etcd
              run: |
                  ../bin/ci-wait-for-docker launch --down db etcd
                  ../bin/ci-wait-for-docker wait --only db etcd
                  echo "127.0.0.1 db" | sudo tee -a /etc/hosts

            - name: Install Rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Create and migrate the persons database
              run: |
                  sqlx database create
                  sqlx migrate run --source persons_migrations/

            - name: Test personhog-replica and personhog-router
              env:
                  OPENSSL_NO_VENDOR: '1'
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config && break
                      [ "$attempt" -lt 3 ] || exit 1
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  cargo test -p personhog-replica -p personhog-router --locked

    node:
        name: OpenAPI and MCP codegen drift, MCP tests
        if: ${{ inputs.node }}
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Free disk space for the service images and node_modules
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            # As check-openapi-types: drf-spectacular boots Django, which needs Postgres and ClickHouse up.
            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: nohup bin/ci-wait-for-docker launch --background --down db clickhouse </dev/null >"$RUNNER_TEMP/compose-launch.log" 2>&1

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              # PostHog's CI retries this step (Depot's retry:); GitHub Actions has no step retry, so loop.
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            # pnpm and Node from the ref's .nvmrc, through PostHog's own composite action. The filter is the union of
            # check-openapi-types' install and ci-mcp's: the frontend and MCP generators, and the product packages
            # the MCP build and unit tests import.
            - name: Install pnpm, Node and the pnpm dependencies
              id: pnpm
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/root --filter=@posthog/frontend... --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile

            - name: Install desktop API client generator
              working-directory: products/desktop
              run: |
                  if [ ! -f ../../bin/build-desktop-api-client.sh ]; then
                      echo "This ref predates the desktop API client regen, so there is nothing to install."
                      exit 0
                  fi
                  pnpm install --frozen-lockfile --filter @posthog/api-client --ignore-scripts --config.node-linker=isolated

            - name: Wait for services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  bin/ci-wait-for-docker wait --only db clickhouse \
                    || { echo "::group::compose launch log"; cat "$RUNNER_TEMP/compose-launch.log" || true; echo "::endgroup::"; exit 1; }

            - name: Regenerate the OpenAPI outputs and the MCP tool YAML and handlers
              # check-openapi-types' own sequence.
              run: |
                  ./bin/hogli build:openapi
                  pnpm --filter=@posthog/mcp run scaffold-yaml -- --sync-all

            - name: Regenerate the MCP tool-inputs schema
              # ci-mcp's "Check MCP schema is up to date" generator (hogli build:schema-mcp).
              run: (cd services/mcp && pnpm exec tsx scripts/generate-tool-schema.ts && pnpm exec oxfmt schema/tool-inputs.json)

            - name: Generated files match what is committed
              run: |
                  git add -N .
                  if git diff --exit-code --stat; then
                      echo "The OpenAPI and MCP outputs are up to date."
                      exit 0
                  fi
                  git diff --binary > "$RUNNER_TEMP/codegen-drift.patch"
                  echo "::error::Generated files differ from the commit: $(git diff --name-only | tr '\n' ' ')"
                  exit 1

            - name: Upload the drift patch
              if: ${{ failure() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: codegen-drift-${{ github.run_id }}
                  path: ${{ runner.temp }}/codegen-drift.patch
                  if-no-files-found: ignore

            # The MCP checks run on the committed files, not the regenerated ones.
            - name: Reset the tree before the MCP checks
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: |
                  git reset -q
                  git checkout -- .
                  git clean -fdq -- services/mcp products frontend/src

            - name: Lint MCP tool names
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: cd services/mcp && pnpm lint-tool-names

            # As ci-mcp's unit-tests job: the workers-pool project needs public/ (from pnpm build) and
            # shared/guidelines.md (from copy-instructions) on disk.
            - name: Build the MCP package
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              working-directory: services/mcp
              run: |
                  pnpm build
                  pnpm exec tsx scripts/copy-instructions.ts

            - name: Type check (tsgo)
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: cd services/mcp && pnpm typecheck

            # The whole unit suite, as ci-mcp runs it. Its tool-definition, schema-snapshot and feature-flag tests
            # read every products/*/mcp/tools.yaml, products/cohorts/mcp/tools.yaml included.
            - name: MCP unit tests, with no snapshot drift
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: |
                  pnpm --filter=@posthog/mcp run test -u
                  if [ -n "$(git status --porcelain -- services/mcp/tests/unit)" ]; then
                      git status --short -- services/mcp/tests/unit
                      git diff -- services/mcp/tests/unit
                      echo "::error::MCP unit test snapshots are out of date."
                      exit 1
                  fi

            - name: MCP Hono unit tests
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: cd services/mcp && pnpm run test:hono

            - name: Where the replace tool appears in the committed MCP files
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: git grep -c "cohorts-replace-static-members" -- services/mcp products/cohorts/mcp || true

    # PostHog's ci-proto.yml in one job: buf lint, buf breaking, and both stub generators with a drift check. The
    # breaking check runs against the merge base with PostHog's master, not master's tip, so upstream's newer protos
    # don't count as this ref's changes. Then the personhog Node tests, prepared as ci-nodejs prepares them.
    proto:
        name: Proto lint, breaking check, stub drift, personhog Node tests
        if: ${{ inputs.proto }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        steps:
            - name: Free disk space for node_modules and the Rust addons
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            - name: Find the merge base with PostHog's master and extract its protos
              run: |
                  head=$(git rev-parse HEAD)
                  git fetch --no-tags --shallow-since="30 days ago" "https://github.com/${SOURCE_REPO}.git" "$head"
                  git fetch --no-tags --shallow-since="30 days ago" https://github.com/PostHog/posthog.git +master:refs/remotes/posthog/master
                  base=$(git merge-base posthog/master HEAD)
                  echo "HEAD:           $head"
                  echo "PostHog master: $(git rev-parse posthog/master)"
                  echo "merge base:     $base"
                  mkdir -p "$RUNNER_TEMP/proto-baseline"
                  git archive "$base" proto | tar -x -C "$RUNNER_TEMP/proto-baseline"
                  echo "Proto files changed since the merge base:"
                  git diff --stat "$base" HEAD -- proto/

            - name: Install buf
              uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
              with:
                  setup_only: true
                  version: '1.50.0'

            - name: Lint protos
              run: buf lint proto/

            - name: Check for breaking changes against the merge base
              if: ${{ !cancelled() }}
              run: buf breaking proto/ --against "$RUNNER_TEMP/proto-baseline/proto/"

            - name: Set up Python
              if: ${{ !cancelled() }}
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              if: ${{ !cancelled() }}
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Regenerate the Python proto stubs
              # ci-proto's python-codegen job: the codegen tools from the lock, then the generator.
              if: ${{ !cancelled() }}
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --no-install-project --only-group proto-codegen
                  bash bin/generate_personhog_proto.sh

            - name: Install pnpm, Node and the Node.js dependencies
              id: pnpm
              if: ${{ !cancelled() }}
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile

            - name: Regenerate the Node proto stubs
              # ci-proto's node-codegen job.
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: |
                  pnpm --dir nodejs run generate:personhog-proto
                  pnpm --dir nodejs run generate:ingestion-worker-proto

            - name: Generated stubs match what is committed
              if: ${{ !cancelled() }}
              run: |
                  git add -N .
                  if git diff --exit-code --stat; then
                      echo "The Python and Node proto stubs are up to date."
                      exit 0
                  fi
                  git diff --binary > "$RUNNER_TEMP/proto-drift.patch"
                  echo "::error::Generated stubs differ from the commit: $(git diff --name-only | tr '\n' ' ')"
                  exit 1

            - name: Upload the drift patch
              if: ${{ failure() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: proto-drift-${{ github.run_id }}
                  path: ${{ runner.temp }}/proto-drift.patch
                  if-no-files-found: ignore

            # The tests run on the committed files, not the regenerated ones.
            - name: Reset the tree before the Node tests
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: |
                  git reset -q
                  git checkout -- .

            # ci-nodejs builds the workspace's Rust addons and TypeScript packages before any Jest run.
            - name: Install Rust
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Prepare the Node.js workspace
              id: prepare
              if: ${{ !cancelled() && steps.pnpm.outcome == 'success' }}
              run: bin/turbo --filter=@posthog/nodejs prepare

            # Type-checks all five test files the RPC commit edits, the postgres-parity one included, with everything
            # they import. Jest's ts-jest runs with isolatedModules, so it transpiles without type-checking.
            - name: Type-check the personhog Node test files
              if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
              working-directory: nodejs
              run: |
                  cat > tsconfig.personhog-check.json <<'EOF'
                  {
                      "extends": "./tsconfig.json",
                      "compilerOptions": { "noEmit": true },
                      "include": [],
                      "files": [
                          "src/common/personhog/client.test.ts",
                          "src/common/personhog/persons.test.ts",
                          "src/common/personhog/personhog-group-repository.test.ts",
                          "src/common/personhog/personhog-person-repository.test.ts",
                          "src/common/personhog/personhog-postgres-parity.serial.test.ts"
                      ]
                  }
                  EOF
                  pnpm exec tsc -p tsconfig.personhog-check.json
                  rm tsconfig.personhog-check.json

            # The four unit test files. personhog-postgres-parity.serial.test.ts isn't run: upstream runs it in
            # ci-nodejs's serial lane against the full dev stack, a Django-built test database and an isolated
            # persons-parity database, which this job doesn't start. It is type-checked above.
            - name: personhog Node unit tests
              if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
              working-directory: nodejs
              run: >-
                  pnpm exec jest --config jest.config.js --forceExit
                  src/common/personhog/client.test.ts
                  src/common/personhog/persons.test.ts
                  src/common/personhog/personhog-group-repository.test.ts
                  src/common/personhog/personhog-person-repository.test.ts

    # The pre-push hook's `hogli ci:preflight --strict`, which a fork push can't run against the right base. Preflight
    # diffs against origin/master and fetches it itself, so origin points at PostHog here. Its migrations check needs
    # a migrated dev stack (Postgres and ClickHouse), and its node checks need the pnpm install.
    preflight:
        name: ci:preflight against PostHog master
        if: ${{ inputs.preflight }}
        runs-on: ubuntu-24.04
        timeout-minutes: 90
        env:
            TEST: '0'
            DEBUG: '1'
            CLICKHOUSE_DATABASE: default
        steps:
            - name: Free disk space for the service images and node_modules
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            # Enough history on both sides to find the merge base, without cloning all of PostHog.
            - name: Point origin at PostHog and fetch master and the ref's recent history
              run: |
                  head=$(git rev-parse HEAD)
                  git fetch --no-tags --shallow-since="21 days ago" "https://github.com/${SOURCE_REPO}.git" "$head"
                  git remote set-url origin https://github.com/PostHog/posthog.git
                  git fetch --no-tags --shallow-since="21 days ago" origin +master:refs/remotes/origin/master
                  echo "HEAD:          $head"
                  echo "origin/master: $(git rev-parse origin/master)"
                  echo "merge base:    $(git merge-base origin/master HEAD)"
                  echo "commits ahead: $(git rev-list --count origin/master..HEAD), behind: $(git rev-list --count HEAD..origin/master)"

            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  nohup bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage </dev/null >"$RUNNER_TEMP/compose-launch.log" 2>&1

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            - name: Install pnpm, Node and the pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@posthog/root --filter=@posthog/frontend... --filter=@posthog/mcp... --filter='./products/*' install --frozen-lockfile

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage temporal" | sudo tee -a /etc/hosts

            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb

            - name: Wait for services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  bin/ci-wait-for-docker wait objectstorage \
                    || { echo "::group::compose launch log"; cat "$RUNNER_TEMP/compose-launch.log" || true; echo "::endgroup::"; exit 1; }

            - name: Throwaway OIDC signing key
              run: |
                  {
                      echo "OIDC_RSA_PRIVATE_KEY<<EOF_OIDC_KEY"
                      openssl genrsa 2048 2>/dev/null
                      echo "EOF_OIDC_KEY"
                  } >> "$GITHUB_ENV"

            # As the runbook's dev-migrate.sh, which the pre-push preflight needed whenever the branch carries a migration.
            - name: Migrate the dev stack
              run: |
                  bin/migrate
                  python manage.py run_async_migrations --complete-noop-migrations

            - name: ci:preflight --strict
              run: ./bin/hogli ci:preflight --strict --against origin/master

    benchmark:
        name: Replace benchmark (release personhog)
        if: ${{ inputs.benchmark }}
        runs-on: ubuntu-24.04
        timeout-minutes: 300
        env:
            # The benchmark runs against the dev stack, not the test databases, as the benchmark README says.
            TEST: '0'
            DEBUG: '1'
            CLICKHOUSE_DATABASE: default
            CARGO_TARGET_DIR: /tmp/cargo-target
            BENCH_DIR: products/cohorts/backend/benchmarks
        steps:
            - name: Free disk space for the service images and the Rust build
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            - name: Check out the benchmark harness
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.benchmark_ref }}
                  path: bench-src
                  sparse-checkout: products/cohorts/backend/benchmarks

            # The ref's code, measured by the harness: the same as running it from a worktree with the harness copied in.
            - name: Put the harness into the ref's checkout
              env:
                  INPUT_REF: ${{ inputs.ref }}
                  INPUT_BENCHMARK_REF: ${{ inputs.benchmark_ref }}
                  INPUT_BENCH_CELLS: ${{ inputs.bench_cells }}
              run: |
                  mkdir -p "$BENCH_DIR"
                  for f in replace_benchmark.py run_bench.sh summarize.py; do cp "bench-src/$BENCH_DIR/$f" "$BENCH_DIR/"; done
                  chmod +x "$BENCH_DIR/run_bench.sh"
                  {
                      echo "ref:     $(git rev-parse HEAD) $(git log -1 --format=%s)"
                      echo "harness: $(git -C bench-src rev-parse HEAD) $(git -C bench-src log -1 --format=%s)"
                  } | tee bench-commits.txt
                  {
                      echo "input_ref:           $INPUT_REF"
                      echo "input_benchmark_ref: $INPUT_BENCHMARK_REF"
                      echo "input_bench_cells:   $INPUT_BENCH_CELLS"
                      echo "resolved_ref:        $(git rev-parse HEAD) $(git log -1 --format=%s)"
                      echo "resolved_harness:    $(git -C bench-src rev-parse HEAD) $(git -C bench-src log -1 --format=%s)"
                      echo "uname:               $(uname -srm)"
                      echo "nproc:               $(nproc)"
                      lscpu | grep -E 'Architecture|CPU\(s\)|Model name|Thread|Core|Socket' || true
                      free -h
                  } | tee runner-info.txt
                  rm -rf bench-src

            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  nohup bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage </dev/null >"$RUNNER_TEMP/compose-launch.log" 2>&1

            # As ci-rust's release build: protoc, the pinned toolchain, system OpenSSL, --locked.
            - name: Install protoc
              uses: ./.github/actions/setup-protoc

            - name: Install Rust
              uses: ./.github/actions/setup-rust
              with:
                  toolchain: 1.91.1

            - name: Build personhog-replica and personhog-router (release)
              working-directory: rust
              env:
                  OPENSSL_NO_VENDOR: '1'
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config && break
                      [ "$attempt" -lt 3 ] || exit 1
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  cargo build -p personhog-replica -p personhog-router --locked --release
                  ls -la "$CARGO_TARGET_DIR/release/personhog-replica" "$CARGO_TARGET_DIR/release/personhog-router"
                  df -h /

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage temporal" | sudo tee -a /etc/hosts

            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb

            - name: Wait for services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
              run: |
                  bin/ci-wait-for-docker wait objectstorage \
                    || { echo "::group::compose launch log"; cat "$RUNNER_TEMP/compose-launch.log" || true; echo "::endgroup::"; exit 1; }

            # bin/migrate ends with setup_tasks_oauth, which signs with RS256 and needs a key. Settings generate one only
            # under TEST; ci-mcp passes a fake key from a repo variable. This job makes a throwaway one.
            - name: Throwaway OIDC signing key
              run: |
                  {
                      echo "OIDC_RSA_PRIVATE_KEY<<EOF_OIDC_KEY"
                      openssl genrsa 2048 2>/dev/null
                      echo "EOF_OIDC_KEY"
                  } >> "$GITHUB_ENV"

            # The README's "migrated with bin/hogli migrations:run", which runs bin/migrate with DEBUG=1: Postgres,
            # ClickHouse (into CLICKHOUSE_DATABASE) and the persons database through sqlx. Then the no-op async
            # migrations, as the runbook's dev-migrate.sh does.
            - name: Migrate the dev stack
              id: migrate
              run: |
                  bin/migrate
                  python manage.py run_async_migrations --complete-noop-migrations

            # run_bench.sh uses the active environment when VIRTUAL_ENV is set. The dependencies live in the runner's
            # Python, so it points there. The binaries are read from /tmp/cargo-target/release, where the build put them.
            - name: Smoke cells
              id: smoke
              env:
                  VIRTUAL_ENV: ${{ env.pythonLocation }}
              run: |
                  set -o pipefail
                  "$BENCH_DIR/run_bench.sh" smoke | tee results_smoke.out
                  python -c 'import json,sys; print(json.dumps([json.loads(l) for l in open(sys.argv[1]) if l.startswith("{")], indent=2))' results_smoke.out > results_smoke.json

            - name: Memory cells
              if: ${{ !cancelled() && steps.migrate.outcome == 'success' && inputs.bench_cells == '' }}
              env:
                  VIRTUAL_ENV: ${{ env.pythonLocation }}
              run: |
                  "$BENCH_DIR/run_bench.sh" memory
                  cp "$BENCH_DIR/results_memory.json" results_memory.json

            # Each cell in its own subprocess, the way the harness's matrix and repeats modes run them. The harness is
            # called directly here, so this step sets the environment run_bench.sh exports. The replica and router it
            # started in the earlier steps keep running for the rest of the job.
            - name: The two 1M replace cells
              if: ${{ !cancelled() && steps.migrate.outcome == 'success' && inputs.bench_cells == '' }}
              env:
                  VIRTUAL_ENV: ${{ env.pythonLocation }}
                  PERSONHOG_ADDR: 127.0.0.1:50052
                  PERSONHOG_TIMEOUT_MS: '60000'
                  PERSONS_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog_persons
              run: |
                  (echo > /dev/tcp/127.0.0.1/50052) 2>/dev/null || { echo "::error::personhog router is not up"; exit 1; }
                  python - <<'PY'
                  import json, os, sys
                  sys.path.insert(0, os.environ["BENCH_DIR"])
                  sys.argv = ["replace_benchmark.py"]
                  import replace_benchmark as bench
                  results = []
                  for churn in ("0.0", "1.0"):
                      print(f"running replace 1000000 {churn}", flush=True)
                      results.append(bench._run_cell_subprocess(["replace", "1000000", churn]))
                      with open("results_1m.json", "w") as f:
                          json.dump(results, f, indent=2)
                  PY

            - name: Custom bench cell
              if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.smoke.outcome == 'success' && inputs.bench_cells != '' }}
              env:
                  BENCH_CELL: ${{ inputs.bench_cells }}
                  DISK_LOG_FILE: disk_log.txt
                  VIRTUAL_ENV: ${{ env.pythonLocation }}
                  PERSONHOG_ADDR: 127.0.0.1:50052
                  PERSONHOG_TIMEOUT_MS: '60000'
                  PERSONS_DATABASE_URL: postgres://posthog:posthog@localhost:5432/posthog_persons
              run: |
                  (echo > /dev/tcp/127.0.0.1/50052) 2>/dev/null || { echo "::error::personhog router is not up"; exit 1; }

                  cat <<'EOF' > "$RUNNER_TEMP/bench_disk_log.sh"
                  #!/usr/bin/env bash
                  set -u
                  label="${1:-snapshot}"
                  log_file="${DISK_LOG_FILE:-disk_log.txt}"
                  {
                      echo "=== DISK SNAPSHOT: ${label} ($(date -u '+%Y-%m-%dT%H:%M:%SZ')) ==="
                      echo "-- df -h / --"
                      df -h /
                      echo "-- docker system df --"
                      docker system df || true
                      echo "-- postgres (posthog_persons) --"
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog -d posthog_persons -c "
                          SELECT
                              relname,
                              pg_total_relation_size(oid) AS total_bytes,
                              pg_size_pretty(pg_total_relation_size(oid)) AS total_pretty,
                              pg_size_pretty(pg_relation_size(oid)) AS table_pretty,
                              pg_size_pretty(pg_indexes_size(oid)) AS indexes_pretty
                          FROM pg_class
                          WHERE relname IN ('posthog_person', 'posthog_cohortpeople')
                            AND relnamespace = 'public'::regnamespace
                          ORDER BY relname;
                      " || true
                      echo "-- clickhouse (${CLICKHOUSE_DATABASE:-default}) --"
                      curl -fsS "http://localhost:8123/?database=${CLICKHOUSE_DATABASE:-default}" --data-binary "
                          SELECT
                              table,
                              sumIf(bytes_on_disk, active) AS active_bytes,
                              formatReadableSize(sumIf(bytes_on_disk, active)) AS active_pretty,
                              sum(bytes_on_disk) AS total_bytes_on_disk,
                              formatReadableSize(sum(bytes_on_disk)) AS total_pretty,
                              sumIf(rows, active) AS active_rows,
                              countIf(active) AS active_parts,
                              count() AS total_parts
                          FROM system.parts
                          WHERE database = '${CLICKHOUSE_DATABASE:-default}'
                            AND table IN ('person', 'person_static_cohort')
                          GROUP BY table
                          ORDER BY table
                          FORMAT PrettyCompactMonoBlock
                      " || true
                      echo ""
                  } | tee -a "$log_file" >&2
                  EOF
                  chmod +x "$RUNNER_TEMP/bench_disk_log.sh"
                  export DISK_LOG_SCRIPT="$RUNNER_TEMP/bench_disk_log.sh"

                  python - <<'PY'
                  import json, os, shutil, subprocess, sys, textwrap

                  spec = os.environ["BENCH_CELL"].strip()
                  parts = spec.split(":")
                  if len(parts) != 3 or parts[0] not in ("replace", "removal"):
                      print(
                          f"::error::bench_cells must be one 'kind:size:arg' cell (e.g. replace:10000000:0.0); got {spec!r}",
                          flush=True,
                      )
                      raise SystemExit(1)
                  kind, size_str, arg = parts
                  try:
                      size = int(size_str)
                      if size <= 0:
                          raise ValueError("size must be positive")
                      if kind == "replace":
                          float(arg)
                      elif arg not in ("per_person", "bulk"):
                          raise ValueError("removal method must be per_person or bulk")
                  except ValueError as exc:
                      print(f"::error::invalid bench_cells {spec!r}: {exc}", flush=True)
                      raise SystemExit(1)

                  disk_log = os.environ["DISK_LOG_SCRIPT"]
                  subprocess.run([disk_log, "before_seeding"], check=False)

                  usage = shutil.disk_usage("/")
                  free_gib = usage.free / (1024**3)
                  free_gb = usage.free / (1000**3)
                  print(f"Disk gate check on /: {free_gib:.2f} GiB ({free_gb:.2f} GB) free", flush=True)
                  if free_gib < 20.0:
                      print(
                          f"::error::Free disk space on / is {free_gib:.2f} GiB ({free_gb:.2f} GB), "
                          f"below the 20 GiB gate required before seeding {spec}.",
                          flush=True,
                      )
                      raise SystemExit(1)

                  child_code = textwrap.dedent(
                      """\
                      import json, os, subprocess, sys

                      kind, size, arg = sys.argv[1], int(sys.argv[2]), sys.argv[3]
                      sys.path.insert(0, os.environ["BENCH_DIR"])
                      sys.argv = ["replace_benchmark.py"]
                      import replace_benchmark as bench

                      bench._setup_django()
                      disk_log = os.environ["DISK_LOG_SCRIPT"]

                      if kind == "replace":
                          orig_seed = bench._seed_clickhouse

                          def _seed_and_log(*a, **kw):
                              res = orig_seed(*a, **kw)
                              subprocess.run([disk_log, "after_seeding"], check=False)
                              return res

                          bench._seed_clickhouse = _seed_and_log
                      else:
                          orig_seed = bench._seed_postgres

                          def _seed_and_log(*a, **kw):
                              res = orig_seed(*a, **kw)
                              subprocess.run([disk_log, "after_seeding"], check=False)
                              return res

                          bench._seed_postgres = _seed_and_log

                      orig_cleanup = bench._cleanup_postgres

                      def _log_and_cleanup(*a, **kw):
                          subprocess.run([disk_log, "after_replace"], check=False)
                          return orig_cleanup(*a, **kw)

                      bench._cleanup_postgres = _log_and_cleanup

                      result = (
                          bench.run_replace_cell(size, float(arg))
                          if kind == "replace"
                          else bench.run_removal_cell(size, arg)
                      )
                      print(json.dumps(result), flush=True)
                      """
                  )

                  print(f"running {kind} {size_str} {arg}", flush=True)
                  completed = subprocess.run(
                      [sys.executable, "-c", child_code, kind, size_str, arg],
                      stdout=subprocess.PIPE,
                      text=True,
                      env=os.environ,
                  )
                  subprocess.run([disk_log, "after_cleanup"], check=False)

                  lines = [line for line in completed.stdout.splitlines() if line.startswith("{")]
                  if completed.returncode != 0 or not lines:
                      result = {
                          "cell": [kind, size_str, arg],
                          "returncode": completed.returncode,
                          "error": (completed.stdout or "subprocess failed; see job stderr log")[-2000:],
                      }
                  else:
                      result = json.loads(lines[-1])
                  with open("results_bench.json", "w") as f:
                      json.dump([result], f, indent=2)
                  if "error" in result:
                      raise SystemExit(1)
                  PY

            - name: Summary, and fail on any cell that errored or broke a check
              if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
              env:
                  BENCH_CELLS: ${{ inputs.bench_cells }}
              run: |
                  cat bench-commits.txt
                  if [ -f runner-info.txt ]; then cat runner-info.txt; fi
                  python - <<'PY'
                  import json, os, pathlib, subprocess
                  bad, total = [], 0
                  names = (
                      ("results_smoke.json", "results_bench.json")
                      if os.environ.get("BENCH_CELLS", "").strip()
                      else ("results_smoke.json", "results_memory.json", "results_1m.json")
                  )
                  for name in names:
                      path = pathlib.Path(name)
                      if not path.exists():
                          bad.append({"file": name, "error": "missing"})
                          continue
                      print(f"== {name}", flush=True)
                      subprocess.run(["python", f"{os.environ['BENCH_DIR']}/summarize.py", name], check=False)
                      for cell in json.loads(path.read_text()):
                          total += 1
                          if "error" in cell:
                              ok = False
                          elif cell["kind"] == "removal":
                              ok = cell["removed_all"]
                          else:
                              ok = (
                                  cell["postgres_exact"]
                                  and cell["clickhouse_exact_after_seconds"] is not None
                                  and cell["clickhouse_mutations"] == 1
                                  and not cell["run_failed"]
                                  and cell["fields_cleared"]
                                  and not cell["is_calculating"]
                              )
                          if not ok:
                              bad.append(cell)
                  print(f"{total} cells, {len(bad)} with an error or a failed check")
                  for cell in bad:
                      print(json.dumps(cell)[:2000])
                  raise SystemExit(1 if bad else 0)
                  PY

            - name: Upload results and logs
              if: ${{ always() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: benchmark-results-${{ github.run_id }}
                  path: |
                      bench-commits.txt
                      runner-info.txt
                      disk_log.txt
                      results_smoke.json
                      results_smoke.out
                      results_memory.json
                      results_1m.json
                      results_bench.json
                      /tmp/ph-replica.log
                      /tmp/ph-router.log
                  if-no-files-found: ignore
