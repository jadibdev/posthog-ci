# One job, one environment: set up PostHog's test stack once, then run named tests, a batch of mutation checks, or
# both. Use it to check a fix or to prove that tests catch their bugs, instead of a full cohort-replace-checks run per
# question, or a throwaway branch per mutation.
#
# The setup mirrors the tests job of cohort-replace-checks.yml; keep the two in step. The migrated test database is
# restored from the cache when no file under any migrations folder has changed, which saves about 17 minutes. That
# makes this an iteration tool: the gate before a reviewer-visible push is a broad cohort-replace-checks run, which
# never uses the cache and migrates every job from scratch.
#
#   gh workflow run cohort-replace-quick.yml -R jadibdev/posthog-ci -f ref=<branch or sha> \
#       -f targets="products/cohorts/backend/test/test_facade_api.py" -f mutations=mutations/r7
#
# Mutations: see mutations/README.md. Each <name>.patch is applied to the ref, the tests listed in <name>.tests run,
# and the patch is reverted. A mutation passes when those tests fail. The job fails if any mutation survives (its tests
# pass), doesn't apply, or errors before its tests can run.
name: Cohort replace quick checks

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Branch, tag or full commit SHA of jadibdev/posthog to check
                required: true
            targets:
                description: pytest targets to run (files or node ids, space-separated); empty runs none
                required: false
                default: ''
            mutations:
                description: Directory of mutations in this repo (e.g. mutations/r7); empty runs none
                required: false
                default: ''

permissions:
    contents: read

env:
    SOURCE_REPO: jadibdev/posthog
    PYTHON_VERSION: 3.14.7
    PY_DEPS_SYNC_TIMEOUT: 600s
    # Test-only values, the same as PostHog's backend CI.
    SECRET_KEY: '6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da' # unsafe - for testing only
    DATABASE_URL: 'postgres://posthog:posthog@localhost:5432/posthog'
    REDIS_URL: 'redis://localhost'
    CLICKHOUSE_HOST: 'localhost'
    CLICKHOUSE_SECURE: 'False'
    CLICKHOUSE_VERIFY: 'False'
    TEST: 1
    OBJECT_STORAGE_ENABLED: 'True'
    OBJECT_STORAGE_ENDPOINT: 'http://localhost:19000'
    OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
    OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'

jobs:
    quick:
        name: Quick checks
        runs-on: ubuntu-24.04
        timeout-minutes: 150
        steps:
            - name: Free disk space for the service images
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /

            - name: Check out the ref
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: ${{ env.SOURCE_REPO }}
                  ref: ${{ inputs.ref }}

            - name: Check out this repo's mutations
              if: ${{ inputs.mutations != '' }}
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  path: .posthog-ci

            - name: Start services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
              run: |
                  cp posthog/user_scripts/latest_user_defined_function.xml docker/clickhouse/user_defined_function.xml
                  nohup bin/ci-wait-for-docker launch --background --down \
                    db redis7 clickhouse zookeeper kafka objectstorage \
                    temporal elasticsearch objectstorage-azure </dev/null >"$RUNNER_TEMP/compose-launch.log" 2>&1

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ env.PYTHON_VERSION }}

            - name: Install uv
              uses: ./.github/actions/setup-uv
              with:
                  save-cache: 'false'

            - name: Install SAML dependencies
              run: |
                  for attempt in 1 2 3; do
                      sudo apt-get update && sudo apt-get install -y libxml2-dev libxmlsec1-dev libxmlsec1-openssl && exit 0
                      echo "apt attempt $attempt failed"; sleep 30
                  done
                  exit 1

            - name: Install sqlx-cli
              uses: ./.github/actions/setup-sqlx-cli

            - name: Install Python dependencies from the ref's lockfile
              run: UV_PROJECT_ENVIRONMENT=$pythonLocation timeout --kill-after=10s "$PY_DEPS_SYNC_TIMEOUT" uv sync --frozen --dev

            - name: Add service hostnames to /etc/hosts
              run: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal" | sudo tee -a /etc/hosts

            - name: Set up needed files
              run: |
                  mkdir -p frontend/dist
                  touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
                  ./bin/download-mmdb

            - name: Wait for services
              env:
                  COMPOSE_FILE: docker-compose.dev.yml:docker-compose.profiles.yml
                  COMPOSE_PROFILES: temporal,azure
              run: |
                  bin/ci-wait-for-docker wait objectstorage \
                    || { echo "::group::compose launch log"; cat "$RUNNER_TEMP/compose-launch.log" || true; echo "::endgroup::"; exit 1; }

            # Keep these three steps the same as in cohort-replace-checks.yml, so both workflows share one cache entry.
            - name: Restore the migrated test database
              id: db-cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/test_posthog.dump
                  key: test-db-v2-${{ hashFiles('**/migrations/**', 'uv.lock', 'docker-compose.dev.yml') }}

            - name: Migrate test_posthog, from the cache when the migrations are unchanged
              env:
                  DATABASE_URL: postgres://posthog:posthog@localhost:5432/test_posthog
                  CACHE_HIT: ${{ steps.db-cache.outputs.cache-hit }}
              run: |
                  fresh_db() {
                      docker compose -f docker-compose.dev.yml exec -T db psql -U posthog postgres -v ON_ERROR_STOP=1 \
                        -c "DROP DATABASE IF EXISTS test_posthog;" -c "CREATE DATABASE test_posthog;"
                  }
                  fresh_db
                  restored=false
                  if [ "$CACHE_HIT" = "true" ]; then
                      if docker compose -f docker-compose.dev.yml exec -T db \
                          pg_restore -U posthog -d test_posthog --no-owner --exit-on-error < "$RUNNER_TEMP/test_posthog.dump"; then
                          restored=true
                          echo "Restored the migrated database from the cache."
                      else
                          echo "::warning::Restoring the cached database failed; migrating from scratch."
                          fresh_db
                      fi
                  fi
                  # After a restore this applies nothing; it would apply any migration the dump lacks.
                  python manage.py migrate
                  echo "DB_RESTORED=$restored" >> "$GITHUB_ENV"

            - name: Dump the migrated test database for the cache
              if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
              run: docker compose -f docker-compose.dev.yml exec -T db pg_dump -U posthog -Fc test_posthog > "$RUNNER_TEMP/test_posthog.dump"

            - name: Save the migrated test database
              if: ${{ steps.db-cache.outputs.cache-hit != 'true' }}
              # Parallel jobs race to save the same key; losing that race is fine.
              continue-on-error: true
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ${{ runner.temp }}/test_posthog.dump
                  key: ${{ steps.db-cache.outputs.cache-primary-key }}

            - name: Run the named tests
              if: ${{ inputs.targets != '' }}
              env:
                  TARGETS: ${{ inputs.targets }}
              # TARGETS is split on whitespace on purpose: it is a list of pytest targets.
              run: pytest -p no:cacheprovider --reuse-db -q --junitxml=junit-targets.xml $TARGETS

            - name: Run the mutation checks
              if: ${{ !cancelled() && inputs.mutations != '' }}
              env:
                  MUTATIONS: ${{ inputs.mutations }}
              run: |
                  # The runner's bash starts with -e; a caught mutation is a failing pytest, so the loop handles exits itself.
                  set +e
                  set -uo pipefail
                  dir=".posthog-ci/$MUTATIONS"
                  shopt -s nullglob
                  patches=("$dir"/*.patch)
                  if [ ${#patches[@]} -eq 0 ]; then echo "::error::No .patch files in $MUTATIONS"; exit 1; fi
                  survived=0; broken=0; killed=0
                  {
                      echo "### Mutation checks: \`$MUTATIONS\` at \`$(git rev-parse --short HEAD)\`"
                      echo
                      echo "| Mutation | Result | Failing tests |"
                      echo "|---|---|---|"
                  } >> "$GITHUB_STEP_SUMMARY"
                  for patch in "${patches[@]}"; do
                      name=$(basename "$patch" .patch)
                      tests_file="$dir/$name.tests"
                      if [ ! -f "$tests_file" ]; then
                          echo "::error::$name has no $name.tests file"; broken=$((broken + 1))
                          echo "| $name | **no tests file** | |" >> "$GITHUB_STEP_SUMMARY"; continue
                      fi
                      mapfile -t targets < <(grep -v '^[[:space:]]*#' "$tests_file" | grep -v '^[[:space:]]*$')
                      if [ ${#targets[@]} -eq 0 ]; then
                          # An empty list would make pytest run every test in the repo.
                          echo "::error::$name.tests lists no tests"; broken=$((broken + 1))
                          echo "| $name | **empty tests file** | |" >> "$GITHUB_STEP_SUMMARY"; continue
                      fi
                      if ! git apply --check "$patch"; then
                          echo "::error::$name does not apply to this ref"; broken=$((broken + 1))
                          echo "| $name | **does not apply** | |" >> "$GITHUB_STEP_SUMMARY"; continue
                      fi
                      git apply "$patch"
                      echo "::group::$name"
                      pytest -p no:cacheprovider --reuse-db -q --junitxml="junit-mut-$name.xml" "${targets[@]}" 2>&1 \
                        | tee "mut-$name.log" | tail -n 40
                      code=${PIPESTATUS[0]}
                      echo "::endgroup::"
                      git apply -R "$patch"
                      failing=$(python - "junit-mut-$name.xml" <<'PY'
                  import sys, xml.etree.ElementTree as ET
                  try:
                      root = ET.parse(sys.argv[1]).getroot()
                  except Exception:
                      sys.exit(0)
                  names = [c.get("name") for c in root.iter("testcase") if c.find("failure") is not None or c.find("error") is not None]
                  print("<br>".join(f"`{n}`" for n in names))
                  PY
                      )
                      # pytest exits 1 when tests failed, which is what a caught mutation looks like. 0 means the
                      # mutation survived; anything else (collection error, no tests, crash) proves nothing.
                      if [ "$code" -eq 1 ]; then
                          killed=$((killed + 1)); result="caught"
                      elif [ "$code" -eq 0 ]; then
                          survived=$((survived + 1)); result="**survived**"; echo "::error::$name survived: its tests pass"
                      else
                          broken=$((broken + 1)); result="**error (pytest exit $code)**"; echo "::error::$name errored (pytest exit $code)"
                      fi
                      echo "| $name | $result | $failing |" >> "$GITHUB_STEP_SUMMARY"
                  done
                  echo >> "$GITHUB_STEP_SUMMARY"
                  echo "Caught $killed, survived $survived, errored or not applied $broken." | tee -a "$GITHUB_STEP_SUMMARY"
                  [ "$survived" -eq 0 ] && [ "$broken" -eq 0 ]

            - name: Upload reports
              if: ${{ always() }}
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: quick-reports-${{ github.run_id }}
                  path: |
                      junit-*.xml
                      mut-*.log
                  if-no-files-found: ignore
